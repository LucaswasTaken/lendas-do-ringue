name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4  # testes de paridade da sim em JS (web/js/sim.js)
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglu1-mesa
      - run: uv sync
      - run: uv run python tools/build_audio.py  # tests/test_web.py serve um .wav
      - run: uv run ruff check .
      - run: xvfb-run -a uv run pytest -q
